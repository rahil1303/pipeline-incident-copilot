name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,dbt]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Install dbt packages
        working-directory: dbt_project
        run: dbt deps --profiles-dir .

      - name: Unit + integration tests
        run: pytest -q

      - name: Regenerate evidence from real dbt runs
        run: copilot collect --out /tmp/evidence

      - name: Baseline eval on fresh evidence
        run: copilot eval --provider baseline --evidence /tmp/evidence --out /tmp/reports
