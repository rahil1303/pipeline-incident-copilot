name: LLM eval gate

# Re-scores the copilot whenever the agent, prompt or scenarios change, and
# fails the check if accuracy drops below MIN_ACCURACY. Uses the Groq free tier.
#
# Setup (one time): repo Settings > Secrets and variables > Actions
#   secret   GROQ_API_KEY   your free key from console.groq.com
#   variable MIN_ACCURACY   e.g. 0.7   (optional, default 0.7)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider spec, e.g. groq, groq:openai/gpt-oss-20b, groq,gemini"
        default: groq
  pull_request:
    paths:
      - "src/**"
      - "scenarios/**"
      - "evidence/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Check for API key
        id: key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::GROQ_API_KEY secret not set; skipping LLM eval"; fi

      - name: Run eval gate
        if: steps.key.outputs.present == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          copilot eval \
            --provider baseline \
            --provider "${{ inputs.provider || 'groq' }}" \
            --min-accuracy "${{ vars.MIN_ACCURACY || '0.7' }}"

      - name: Publish report to job summary
        if: always() && steps.key.outputs.present == 'true'
        run: cat reports/*.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: eval-reports
          path: reports/
