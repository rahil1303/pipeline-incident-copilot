[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-incident-copilot"
version = "0.1.0"
description = "An LLM copilot that diagnoses failed dbt pipeline runs, with a labelled eval harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahil Sharma" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
# dbt + DuckDB are only needed to (re)generate evidence; evals run without them.
dbt = ["dbt-core>=1.8", "dbt-duckdb>=1.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
copilot = "incident_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
